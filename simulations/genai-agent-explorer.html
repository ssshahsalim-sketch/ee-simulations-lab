<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Gen AI → AI Agent → Agentic AI | Explorer</title>
<style>
  :root{
    --navy-bg:#0a1220;
    --navy-panel:#0f1b30;
    --navy-panel-2:#132340;
    --grid-line:rgba(120,170,255,0.06);
    --cyan:#00d9ff;
    --cyan-dim:rgba(0,217,255,0.15);
    --amber:#ffb454;
    --amber-dim:rgba(255,180,84,0.15);
    --green:#4ade80;
    --green-dim:rgba(74,222,128,0.15);
    --danger:#ff5c7a;
    --danger-dim:rgba(255,92,122,0.15);
    --text:#e7eefc;
    --text-dim:#8ea0c4;
    --border:rgba(120,170,255,0.18);
    --font-mono:'IBM Plex Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/32px 32px,
      var(--navy-bg);
    color:var(--text);
    font-family:var(--font-mono);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    padding:22px 16px 14px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:rgba(10,18,32,0.85);
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(6px);
  }
  header .eyebrow{
    color:var(--cyan);letter-spacing:3px;font-size:11px;text-transform:uppercase;
  }
  header h1{
    margin:6px 0 4px;font-size:clamp(20px,4vw,30px);
    background:linear-gradient(90deg,var(--cyan),var(--amber));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{margin:0;color:var(--text-dim);font-size:13px;}
  nav.tabs{
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    padding:12px 10px 0;max-width:1100px;margin:0 auto;
  }
  nav.tabs button{
    font-family:var(--font-mono);
    background:var(--navy-panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:9px 14px;border-radius:8px 8px 0 0;
    font-size:12.5px;cursor:pointer;transition:.15s;
    white-space:nowrap;
  }
  nav.tabs button:hover{color:var(--text);border-color:var(--cyan);}
  nav.tabs button.active{
    color:var(--navy-bg);background:var(--cyan);border-color:var(--cyan);font-weight:700;
  }
  main{max-width:1100px;margin:0 auto;padding:18px 14px 60px;}
  .panel{display:none;animation:fade .25s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .card{
    background:var(--navy-panel);border:1px solid var(--border);
    border-radius:12px;padding:16px;margin-bottom:16px;
  }
  .card h2{margin:0 0 10px;font-size:17px;color:var(--cyan);}
  .card h3{margin:0 0 8px;font-size:14px;color:var(--amber);}
  .card p{color:var(--text-dim);font-size:13.5px;line-height:1.6;margin:0 0 8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr;}}

  button.btn{
    font-family:var(--font-mono);
    background:var(--navy-panel-2);border:1px solid var(--cyan);color:var(--cyan);
    padding:9px 16px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;
    transition:.15s;margin:3px 6px 3px 0;
  }
  button.btn:hover{background:var(--cyan);color:var(--navy-bg);}
  button.btn.amber{border-color:var(--amber);color:var(--amber);}
  button.btn.amber:hover{background:var(--amber);color:var(--navy-bg);}
  button.btn.green{border-color:var(--green);color:var(--green);}
  button.btn.green:hover{background:var(--green);color:var(--navy-bg);}
  button.btn:disabled{opacity:.35;cursor:not-allowed;}
  button.btn:disabled:hover{background:var(--navy-panel-2);color:inherit;}

  .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .pill{
    border:1px solid var(--border);background:var(--navy-panel-2);color:var(--text-dim);
    padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;
  }
  .pill:hover{color:var(--text);border-color:var(--amber);}

  .badge{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.5px;}
  .badge.cyan{background:var(--cyan-dim);color:var(--cyan);}
  .badge.amber{background:var(--amber-dim);color:var(--amber);}
  .badge.green{background:var(--green-dim);color:var(--green);}
  .badge.danger{background:var(--danger-dim);color:var(--danger);}

  .output-box{
    background:#060c18;border:1px dashed var(--border);border-radius:10px;
    padding:14px;min-height:70px;font-size:13.5px;line-height:1.7;color:var(--text);
    white-space:pre-wrap;
  }
  .caret{display:inline-block;width:7px;height:15px;background:var(--cyan);
    vertical-align:-2px;animation:blink 0.8s steps(2) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;}
  .bar-label{width:90px;color:var(--text-dim);text-align:right;flex-shrink:0;}
  .bar-track{flex:1;background:#060c18;border-radius:5px;height:16px;overflow:hidden;border:1px solid var(--border);}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--amber));width:0;transition:width .6s ease;}
  .bar-fill.chosen{background:linear-gradient(90deg,var(--green),var(--cyan));}
  .bar-pct{width:42px;font-size:11px;color:var(--text-dim);}

  .log-box{
    background:#060c18;border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;height:200px;overflow-y:auto;font-size:12px;line-height:1.8;
  }
  .log-box .line{opacity:0;animation:fade .3s ease forwards;}
  .log-box .line.step{color:var(--cyan);}
  .log-box .line.tool{color:var(--amber);}
  .log-box .line.result{color:var(--text-dim);}
  .log-box .line.final{color:var(--green);font-weight:700;}
  .log-box .line.warn{color:var(--danger);font-weight:700;}

  svg text{font-family:var(--font-mono);}
  .node-box{fill:var(--navy-panel-2);stroke:var(--border);stroke-width:1.5;}
  .node-box.active{stroke:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan));}
  .node-label{fill:var(--text);font-size:11px;}
  .node-sub{fill:var(--text-dim);font-size:9px;}
  .flow-line{stroke:var(--border);stroke-width:2;fill:none;}
  .flow-dot{fill:var(--cyan);filter:drop-shadow(0 0 5px var(--cyan));}

  table.cmp{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.cmp th,table.cmp td{border:1px solid var(--border);padding:9px 10px;text-align:left;vertical-align:top;}
  table.cmp th{background:var(--navy-panel-2);color:var(--cyan);font-size:12px;}
  table.cmp td.rowhead{color:var(--amber);font-weight:700;white-space:nowrap;}
  table.cmp tr:nth-child(even) td{background:rgba(255,255,255,0.02);}

  .task-list{list-style:none;margin:0;padding:0;}
  .task-list li{
    display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;
    font-size:12.5px;color:var(--text-dim);margin-bottom:4px;border:1px solid transparent;
  }
  .task-list li.done{color:var(--green);border-color:rgba(74,222,128,.25);background:var(--green-dim);}
  .task-list li.active-task{color:var(--amber);border-color:rgba(255,180,84,.3);background:var(--amber-dim);}
  .check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:11px;}
  .task-list li.done .check{background:var(--green);border-color:var(--green);color:#04140a;}

  .mem-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;}
  .mem-item{background:var(--navy-panel-2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;}
  .mem-item .k{color:var(--text-dim);display:block;font-size:10px;}
  .mem-item .v{color:var(--text);font-weight:600;}

  .budget-wrap{margin:10px 0;}
  .budget-track{background:#060c18;border:1px solid var(--border);border-radius:8px;height:22px;overflow:hidden;position:relative;}
  .budget-fill{height:100%;background:var(--green);width:0%;transition:width .6s ease, background .3s ease;}
  .budget-fill.over{background:var(--danger);}
  .budget-text{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-top:4px;}

  .glossary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:700px){.glossary-grid{grid-template-columns:1fr;}}
  .gterm{background:var(--navy-panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .gterm b{color:var(--amber);font-size:13px;}
  .gterm p{margin:4px 0 0;font-size:12px;color:var(--text-dim);}

  .quiz-q{margin-bottom:18px;}
  .quiz-opt{
    display:block;width:100%;text-align:left;background:var(--navy-panel-2);
    border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;
    font-family:var(--font-mono);font-size:12.5px;cursor:pointer;margin-bottom:6px;
  }
  .quiz-opt:hover{border-color:var(--cyan);}
  .quiz-opt.correct{border-color:var(--green);background:var(--green-dim);color:var(--green);}
  .quiz-opt.wrong{border-color:var(--danger);background:var(--danger-dim);color:var(--danger);}
  .quiz-opt:disabled{cursor:default;}
  .quiz-exp{font-size:12px;color:var(--text-dim);margin-top:4px;padding-left:2px;display:none;}
  .quiz-exp.show{display:block;}
  #scoreLine{font-size:13px;color:var(--amber);margin-top:6px;}

  .note{
    border-left:3px solid var(--amber);background:var(--amber-dim);
    padding:8px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--text);margin:10px 0;
  }
  .note.cyan{border-color:var(--cyan);background:var(--cyan-dim);}
  .note.green{border-color:var(--green);background:var(--green-dim);}
  .note.danger{border-color:var(--danger);background:var(--danger-dim);}
  code{color:var(--amber);background:#060c18;padding:1px 5px;border-radius:4px;font-size:12px;}
  footer{text-align:center;color:var(--text-dim);font-size:11px;padding:18px;opacity:.6;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Apna Electromechanic Service — Engineering Tools Suite</div>
  <h1>Gen AI → AI Agent → Agentic AI</h1>
  <p>An interactive explainer: what each term actually means, using one running example</p>
  <nav class="tabs" id="tabNav"></nav>
</header>

<main id="mainArea"></main>

<footer>Offline single-file explainer · works without internet · for training & client education use</footer>

<script>
/* ============================= TAB DEFINITIONS ============================= */
const TABS = [
  {id:'overview', label:'① Overview'},
  {id:'genai', label:'② Generative AI'},
  {id:'agent', label:'③ AI Agent'},
  {id:'agentic', label:'④ Agentic AI'},
  {id:'compare', label:'⑤ Compare'},
  {id:'glossary', label:'⑥ Glossary & Quiz'},
];

const tabNav = document.getElementById('tabNav');
const mainArea = document.getElementById('mainArea');

TABS.forEach((t,i)=>{
  const b = document.createElement('button');
  b.textContent = t.label;
  b.dataset.tab = t.id;
  if(i===0) b.classList.add('active');
  b.addEventListener('click', ()=>showTab(t.id));
  tabNav.appendChild(b);

  const p = document.createElement('div');
  p.className = 'panel' + (i===0?' active':'');
  p.id = 'panel-'+t.id;
  mainArea.appendChild(p);
});

function showTab(id){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================= TAB 1: OVERVIEW ============================= */
(function buildOverview(){
  const el = document.getElementById('panel-overview');
  el.innerHTML = `
    <div class="card">
      <h2>One idea, three layers</h2>
      <p>Generative AI, an AI Agent, and Agentic AI are not three unrelated technologies — they're
      <b style="color:var(--text)">layers built on top of each other</b>. Each layer keeps everything the
      previous layer could do, and adds one new capability. Click a ring below to see what it adds.</p>
      <div class="grid2">
        <svg viewBox="0 0 320 320" style="width:100%;max-width:340px;margin:0 auto;display:block;">
          <circle cx="160" cy="160" r="150" fill="none" class="ov-ring" data-ring="agentic" stroke="var(--green)" stroke-width="2" stroke-dasharray="4 3" style="cursor:pointer;"/>
          <circle cx="160" cy="160" r="100" fill="none" class="ov-ring" data-ring="agent" stroke="var(--amber)" stroke-width="2" stroke-dasharray="4 3" style="cursor:pointer;"/>
          <circle cx="160" cy="160" r="52" class="ov-ring" data-ring="genai" fill="var(--cyan-dim)" stroke="var(--cyan)" stroke-width="2" style="cursor:pointer;"/>
          <text x="160" y="156" text-anchor="middle" class="node-label" style="font-size:11px;font-weight:700;">GENERATIVE</text>
          <text x="160" y="170" text-anchor="middle" class="node-label" style="font-size:11px;font-weight:700;">AI</text>
          <text x="160" y="70" text-anchor="middle" class="node-sub" style="fill:var(--amber);font-size:10.5px;font-weight:700;">AI AGENT</text>
          <text x="160" y="22" text-anchor="middle" class="node-sub" style="fill:var(--green);font-size:10.5px;font-weight:700;">AGENTIC AI</text>
        </svg>
        <div>
          <div id="ovDetail" class="note cyan">
            <b style="color:var(--cyan)">GENERATIVE AI — the core engine.</b><br>
            Takes one prompt in, predicts and generates one output (text, image, code) based on patterns
            learned from training data. No memory between requests. No tools. No goals of its own.
          </div>
          <div class="note" style="margin-top:8px;">👆 Tap the middle or outer ring to see what gets added at each layer.</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>The running example used in this tool</h2>
      <p>Every lab in this explorer answers the <b style="color:var(--text)">same kind of question about a trip
      to Goa</b> — so you can see plainly what changes as we move from layer to layer, instead of comparing
      apples to oranges.</p>
      <div class="grid3">
        <div class="note cyan"><b style="color:var(--cyan)">② Gen AI</b><br>"Suggest 3 places to visit in Goa" → a single written answer.</div>
        <div class="note"><b style="color:var(--amber)">③ AI Agent</b><br>"What's the weather in Goa this weekend?" → checks a live tool, then answers.</div>
        <div class="note green"><b style="color:var(--green)">④ Agentic AI</b><br>"Plan a 3-day Goa trip under ₹15,000" → plans, checks multiple tools, fixes its own budget overrun, delivers a finished plan.</div>
      </div>
    </div>
  `;
  const detail = document.getElementById('ovDetail');
  const info = {
    genai: `<b style="color:var(--cyan)">GENERATIVE AI — the core engine.</b><br>Takes one prompt in, predicts and generates one output (text, image, code) based on patterns learned from training data. No memory between requests. No tools. No goals of its own.`,
    agent: `<b style="color:var(--amber)">AI AGENT — Gen AI + tools + a perceive→act loop.</b><br>Same generative core, but it can now sense its environment (read a tool result, an API response, a file) and take an action (call a tool) before answering. Usually handles <i>one</i> well-defined task per request.`,
    agentic: `<b style="color:var(--green)">AGENTIC AI — Agent + planning + memory + self-correction.</b><br>Given a goal instead of a single question, it breaks the goal into sub-tasks, works through them using tools, remembers what it has found so far, checks its own progress against the goal, and re-plans if something doesn't fit — with little to no step-by-step human guidance.`
  };
  document.querySelectorAll('.ov-ring').forEach(r=>{
    r.addEventListener('click', ()=>{ detail.innerHTML = info[r.dataset.ring]; detail.className = 'note ' + (r.dataset.ring==='genai'?'cyan':r.dataset.ring==='agentic'?'green':''); });
  });
})();

/* ============================= TAB 2: GENERATIVE AI LAB ============================= */
(function buildGenAI(){
  const el = document.getElementById('panel-genai');
  el.innerHTML = `
    <div class="card">
      <h2>② Generative AI — one prompt in, one answer out</h2>
      <p>Pick a prompt below. Watch the model generate its answer <b style="color:var(--text)">word by word</b> —
      that's literally how it works: predicting the single most likely next word, over and over, until it stops.</p>
      <div class="pill-row" id="genPresets"></div>
      <div class="output-box" id="genOutput">Pick a prompt above to generate a response…</div>
      <div class="note" id="genMemNote" style="display:none;"></div>
    </div>

    <div class="card">
      <h3>🔬 Peek under the hood: predicting the next word</h3>
      <p>After the words <code>"The best time to visit Goa is"</code>, the model doesn't "know" the answer —
      it scores likely next words and picks (roughly) the most probable one.</p>
      <div id="probChart"></div>
    </div>

    <div class="card">
      <h3>Try a follow-up (to see the limitation)</h3>
      <p>Type something that only makes sense <i>after</i> the previous answer, like <code>"make it shorter"</code>,
      then generate again.</p>
      <input id="followupInput" type="text" placeholder="e.g. make it shorter" style="width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:#060c18;color:var(--text);font-family:var(--font-mono);font-size:13px;margin-bottom:8px;">
      <button class="btn amber" id="followupBtn">Generate (no memory)</button>
      <div class="output-box" id="followupOutput" style="display:none;margin-top:10px;"></div>
    </div>

    <div class="grid2">
      <div class="card"><h3>✅ Generative AI can</h3><p>Produce fluent, plausible text/code/images from patterns learned during training — instantly and for almost any topic.</p></div>
      <div class="card"><h3>❌ Generative AI (alone) can't</h3><p>Browse the live web, remember earlier turns on its own, take real-world actions, or verify that its own answer is actually correct.</p></div>
    </div>
  `;

  const presets = [
    {label:'"Suggest 3 places to visit in Goa"', text:"Sure! 1) Baga Beach — lively shacks, water sports, and a great sunset stretch. 2) Fort Aguada — a 17th-century Portuguese fort with panoramic sea views. 3) Dudhsagar Falls — a dramatic four-tiered waterfall on the Goa–Karnataka border, best after the monsoon."},
    {label:'"Explain photosynthesis in one line"', text:"Photosynthesis is how plants use sunlight, water, and carbon dioxide to make glucose and release oxygen."},
    {label:'"Wish someone luck for an exam, 2 lines"', text:"Wishing you calm nerves and a clear mind tomorrow — you have prepared well, so trust yourself. Go show that exam who's boss!"}
  ];
  const presetWrap = document.getElementById('genPresets');
  presets.forEach((p,i)=>{
    const btn = document.createElement('button');
    btn.className = 'pill'; btn.textContent = p.label;
    btn.addEventListener('click', ()=>typeOut(p.text));
    presetWrap.appendChild(btn);
  });

  let typeTimer = null;
  function typeOut(text){
    clearInterval(typeTimer);
    const box = document.getElementById('genOutput');
    const words = text.split(' ');
    let i = 0;
    box.innerHTML = '<span class="caret"></span>';
    document.getElementById('genMemNote').style.display='none';
    typeTimer = setInterval(()=>{
      if(i>=words.length){ clearInterval(typeTimer); document.getElementById('genMemNote').style.display='block';
        document.getElementById('genMemNote').innerHTML = '🔒 <b>No memory:</b> this generation is already "forgotten." Nothing here is carried into the next request unless a separate app resends the conversation.';
        return; }
      box.innerHTML = words.slice(0,i+1).join(' ') + ' <span class="caret"></span>';
      i++;
    }, 55);
  }

  // probability bars
  const candidates = [{w:'November',p:42},{w:'winter',p:23},{w:'December',p:18},{w:'October',p:11},{w:'summer',p:6}];
  const chart = document.getElementById('probChart');
  candidates.forEach((c,idx)=>{
    const row = document.createElement('div');
    row.className='bar-row';
    row.innerHTML = `<div class="bar-label">${c.w}</div><div class="bar-track"><div class="bar-fill${idx===0?' chosen':''}" data-p="${c.p}"></div></div><div class="bar-pct">${c.p}%</div>`;
    chart.appendChild(row);
  });
  setTimeout(()=>{
    document.querySelectorAll('#probChart .bar-fill').forEach(f=>{ f.style.width = f.dataset.p + '%'; });
  }, 300);
  const note2 = document.createElement('div');
  note2.className='note cyan'; note2.style.marginTop='8px';
  note2.innerHTML = '👉 <b>"November"</b> scored highest, so a typical model picks it (with a little randomness allowed — that\'s the "temperature" setting) and continues from there, one word at a time.';
  chart.appendChild(note2);

  document.getElementById('followupBtn').addEventListener('click', ()=>{
    const box = document.getElementById('followupOutput');
    box.style.display='block';
    box.innerHTML = "I'm not sure what 'it' refers to — could you give me the full request again? <span style='color:var(--text-dim);font-style:italic;'>(a fresh generation has no idea a previous answer about Goa ever existed)</span>";
  });
})();

/* ============================= TAB 3: AI AGENT LAB ============================= */
(function buildAgent(){
  const el = document.getElementById('panel-agent');
  el.innerHTML = `
    <div class="card">
      <h2>③ AI Agent — Gen AI + a tool + a perceive→act loop</h2>
      <p><b style="color:var(--text)">Goal:</b> "What's the weather in Goa this weekend? Should I pack an umbrella?"
      Watch the model realise it needs live data, call a weather tool, and then answer using the result.</p>
      <svg id="agentSvg" viewBox="0 0 700 190" style="width:100%;height:auto;">
        <path id="agentPath" class="flow-line" d="M60,95 L640,95"/>
        <g id="agentNodes"></g>
        <circle id="agentDot" class="flow-dot" r="7" cx="60" cy="95"/>
      </svg>
      <div class="pill-row">
        <button class="btn" id="agentRun">▶ Run Agent (step-by-step)</button>
        <button class="btn amber" id="agentNoTool">Try WITHOUT tool access</button>
        <button class="btn green" id="agentReset">↺ Reset</button>
      </div>
      <div class="log-box" id="agentLog"></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>✅ AI Agent can</h3><p>Use tools/APIs, react to real-time information, and complete one well-defined task by combining reasoning with action.</p></div>
      <div class="card"><h3>❌ A (simple) agent typically doesn't</h3><p>Independently break a big goal into many sub-tasks, remember across unrelated sessions, or keep working over a long horizon without a human re-prompting it.</p></div>
    </div>
  `;

  const nodeDefs = [
    {x:60, label:'User', sub:'asks question'},
    {x:230, label:'LLM Brain', sub:'reasoning'},
    {x:400, label:'Weather Tool', sub:'external API'},
    {x:570, label:'LLM Brain', sub:'final answer'},
    {x:640, label:'User', sub:'gets reply'}
  ];
  const nodesG = document.getElementById('agentNodes');
  nodeDefs.forEach((n,i)=>{
    if(i===4) return; // reuse last visually near edge, skip duplicate box
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.innerHTML = `<rect class="node-box" id="anode${i}" x="${n.x-40}" y="65" width="80" height="60" rx="10"/>
      <text class="node-label" x="${n.x}" y="92" text-anchor="middle">${n.label}</text>
      <text class="node-sub" x="${n.x}" y="107" text-anchor="middle">${n.sub}</text>`;
    nodesG.appendChild(g);
  });

  const steps = [
    {node:0, log:'🧑 User: "What\'s the weather in Goa this weekend? Should I pack an umbrella?"', cls:'step'},
    {node:1, log:'🧠 LLM reasons: "I don\'t have live weather data — I should call a tool."', cls:'step'},
    {node:2, log:'🔧 Tool call → weather_api(city="Goa", range="weekend")', cls:'tool'},
    {node:2, log:'📡 Tool result: 31°C, 70% chance of rain, thunderstorms likely', cls:'result'},
    {node:3, log:'🧠 LLM combines the tool result with the question', cls:'step'},
    {node:3, log:'✅ Final answer: "This weekend in Goa: ~31°C with a 70% chance of thunderstorms. Yes — pack an umbrella and a light raincoat!"', cls:'final'}
  ];
  let idx = 0;
  const dot = document.getElementById('agentDot');
  const logBox = document.getElementById('agentLog');

  function addLog(text, cls){
    const d = document.createElement('div');
    d.className = 'line ' + cls;
    d.textContent = text;
    logBox.appendChild(d);
    logBox.scrollTop = logBox.scrollHeight;
  }
  function highlightNode(i){
    for(let k=0;k<4;k++){ const b=document.getElementById('anode'+k); if(b) b.classList.remove('active'); }
    const b = document.getElementById('anode'+i);
    if(b) b.classList.add('active');
    const targetX = nodeDefs[i].x;
    dot.setAttribute('cx', targetX);
  }
  document.getElementById('agentRun').addEventListener('click', (e)=>{
    e.target.disabled = true;
    function next(){
      if(idx>=steps.length){ e.target.disabled=false; return; }
      const s = steps[idx];
      highlightNode(s.node);
      addLog(s.log, s.cls);
      idx++;
      setTimeout(next, 1100);
    }
    next();
  });
  document.getElementById('agentReset').addEventListener('click', ()=>{
    idx=0; logBox.innerHTML=''; highlightNode(0); document.getElementById('agentRun').disabled=false;
  });
  document.getElementById('agentNoTool').addEventListener('click', ()=>{
    addLog('🧑 Same question, but imagine this model has NO tool access:', 'step');
    addLog('💬 "I don\'t have access to real-time weather data, so I can\'t say for certain — but Goa often sees monsoon rain around this time of year, so an umbrella might be wise." (a guess, not a fact)', 'result');
  });
})();

/* ============================= TAB 4: AGENTIC AI LAB ============================= */
(function buildAgentic(){
  const el = document.getElementById('panel-agentic');
  el.innerHTML = `
    <div class="card">
      <h2>④ Agentic AI — plans, uses memory, and fixes its own mistakes</h2>
      <p><b style="color:var(--text)">Goal given to the system:</b> "Plan a 3-day trip to Goa within a total budget of ₹15,000."
      No further instructions are given — the system must figure out the sub-tasks itself, use tools for each,
      remember results, and correct course if the plan goes over budget.</p>
      <div class="pill-row">
        <button class="btn" id="agenticRun">▶ Run Agentic Loop</button>
        <button class="btn amber" id="agenticStep">⏭ Next Phase</button>
        <button class="btn green" id="agenticReset">↺ Reset</button>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>🔁 Plan → Act → Observe → Reflect</h3>
        <svg id="loopSvg" viewBox="0 0 260 260" style="width:100%;max-width:260px;display:block;margin:0 auto;">
          <circle cx="130" cy="130" r="95" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="5 4"/>
          <g id="loopNodes"></g>
          <circle id="loopDot" class="flow-dot" r="7" cx="130" cy="35"/>
        </svg>
        <div id="phaseLabel" class="note green" style="text-align:center;">Ready — press ▶ to start</div>
      </div>
      <div class="card">
        <h3>🗒 Task list</h3>
        <ul class="task-list" id="taskList"></ul>
        <h3 style="margin-top:14px;">🧠 Memory</h3>
        <div class="mem-grid" id="memGrid"></div>
        <div class="budget-wrap">
          <div class="budget-track"><div class="budget-fill" id="budgetFill"></div></div>
          <div class="budget-text"><span id="budgetSpent">₹0 spent</span><span>Budget: ₹15,000</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>📜 Agent log</h3>
      <div class="log-box" id="agenticLog" style="height:230px;"></div>
    </div>

    <div class="grid2">
      <div class="card"><h3>✅ Agentic AI can</h3><p>Autonomously plan multi-step work, use memory across steps, monitor its own progress against a goal, replan and self-correct, and keep going with minimal human input.</p></div>
      <div class="card"><h3>⚠️ …which is exactly why it needs guardrails</h3><p>Budget/scope limits, human approval checkpoints for costly or risky actions, and monitoring — because more autonomy means more room for expensive mistakes if left unchecked.</p></div>
    </div>
  `;

  const loopPhases = [
    {name:'PLAN', angle:-90},
    {name:'ACT', angle:0},
    {name:'OBSERVE', angle:90},
    {name:'REFLECT', angle:180}
  ];
  const loopNodes = document.getElementById('loopNodes');
  loopPhases.forEach(p=>{
    const rad = p.angle * Math.PI/180;
    const x = 130 + 95*Math.cos(rad), y = 130 + 95*Math.sin(rad);
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.innerHTML = `<circle class="node-box" id="loop-${p.name}" cx="${x}" cy="${y}" r="26"/>
      <text class="node-label" x="${x}" y="${y+4}" text-anchor="middle" style="font-size:9px;">${p.name}</text>`;
    loopNodes.appendChild(g);
  });
  function setLoopDot(angle){
    const rad = angle*Math.PI/180;
    document.getElementById('loopDot').setAttribute('cx', 130+95*Math.cos(rad));
    document.getElementById('loopDot').setAttribute('cy', 130+95*Math.sin(rad));
  }
  function setPhase(name){
    loopPhases.forEach(p=> document.getElementById('loop-'+p.name).classList.remove('active'));
    const found = loopPhases.find(p=>p.name===name);
    if(found){ document.getElementById('loop-'+name).classList.add('active'); setLoopDot(found.angle); }
    document.getElementById('phaseLabel').textContent = 'Phase: ' + name;
  }

  const taskDefs = [
    'Check flight options within budget',
    'Check hotel options within budget',
    'Check weekend weather',
    'Estimate local transport & food',
    'Build day-wise itinerary'
  ];
  const taskListEl = document.getElementById('taskList');
  taskDefs.forEach((t,i)=>{
    const li = document.createElement('li');
    li.id = 'task'+i;
    li.innerHTML = `<span class="check"></span><span>${t}</span>`;
    taskListEl.appendChild(li);
  });
  function setTask(i, state){
    const li = document.getElementById('task'+i);
    if(!li) return;
    li.classList.remove('done','active-task');
    if(state==='active'){ li.classList.add('active-task'); }
    if(state==='done'){ li.classList.add('done'); li.querySelector('.check').textContent='✓'; }
  }

  const memGrid = document.getElementById('memGrid');
  function setMem(k,v){
    let item = document.getElementById('mem-'+k);
    if(!item){
      item = document.createElement('div');
      item.className='mem-item'; item.id='mem-'+k;
      item.innerHTML = `<span class="k">${k}</span><span class="v"></span>`;
      memGrid.appendChild(item);
    }
    item.querySelector('.v').textContent = v;
  }

  const budgetFill = document.getElementById('budgetFill');
  const budgetSpent = document.getElementById('budgetSpent');
  function setBudget(amount, over){
    const pct = Math.min(100, (amount/15000)*100);
    budgetFill.style.width = pct+'%';
    budgetFill.classList.toggle('over', !!over);
    budgetSpent.textContent = '₹'+amount.toLocaleString('en-IN')+' spent' + (over?' (OVER BUDGET)':'');
  }

  const logBox = document.getElementById('agenticLog');
  function addLog(text, cls){
    const d = document.createElement('div');
    d.className = 'line ' + cls;
    d.textContent = text;
    logBox.appendChild(d);
    logBox.scrollTop = logBox.scrollHeight;
  }

  const script = [
    ()=>{ setPhase('PLAN'); addLog('🧠 PLAN: Goal received — "3-day Goa trip, budget ₹15,000." Breaking into sub-tasks:', 'step');
          taskDefs.forEach(t=> addLog('   • '+t, 'result')); },
    ()=>{ setPhase('ACT'); setTask(0,'active'); addLog('🔧 ACT: Tool call → flights_api(route="Goa", pax=1)', 'tool'); },
    ()=>{ setPhase('OBSERVE'); addLog('📡 OBSERVE: Round-trip flight found — ₹4,500', 'result'); setMem('Flight','₹4,500'); setTask(0,'done'); setBudget(4500,false); },
    ()=>{ setPhase('ACT'); setTask(1,'active'); addLog('🔧 ACT: Tool call → hotels_api(city="Goa", nights=3)', 'tool'); },
    ()=>{ setPhase('OBSERVE'); addLog('📡 OBSERVE: "Sea Breeze Inn", 3 nights — ₹9,000', 'result'); setMem('Hotel','Sea Breeze Inn — ₹9,000'); setTask(1,'done'); setBudget(13500,false); },
    ()=>{ setPhase('ACT'); setTask(2,'active'); addLog('🔧 ACT: Tool call → weather_api(city="Goa", range="trip dates")', 'tool'); },
    ()=>{ setPhase('OBSERVE'); addLog('📡 OBSERVE: Sunny, 30–32°C, low rain chance', 'result'); setMem('Weather','Sunny, 30–32°C'); setTask(2,'done'); },
    ()=>{ setPhase('ACT'); setTask(3,'active'); addLog('🔧 ACT: Estimating local transport & food from trip length', 'tool'); },
    ()=>{ setPhase('OBSERVE'); addLog('📡 OBSERVE: Estimated extras — ₹3,000', 'result'); setMem('Extras','₹3,000'); setTask(3,'done'); setBudget(16500, true); },
    ()=>{ setPhase('REFLECT'); addLog('🔎 REFLECT: Running total ₹16,500 EXCEEDS the ₹15,000 budget by ₹1,500.', 'warn'); },
    ()=>{ setPhase('PLAN'); addLog('🧠 RE-PLAN: Swapping to a lower-cost hotel to fix the overrun.', 'step');
          addLog('🔧 ACT: Tool call → hotels_api(city="Goa", nights=3, max_price=7000)', 'tool'); },
    ()=>{ setPhase('OBSERVE'); addLog('📡 OBSERVE: "Palm Grove Guesthouse", 3 nights — ₹6,500', 'result'); setMem('Hotel','Palm Grove Guesthouse — ₹6,500 (updated)'); setBudget(14000,false); addLog('✅ New total: ₹14,000 — back within budget.', 'final'); },
    ()=>{ setPhase('ACT'); setTask(4,'active'); addLog('🔧 ACT: Assembling day-wise itinerary from everything in memory…', 'tool'); },
    ()=>{ setTask(4,'done'); addLog('✅ DONE — Goal achieved autonomously. Total cost ₹14,000 (within budget):', 'final');
          addLog('   Day 1: Arrive, check into Palm Grove Guesthouse, sunset at Baga Beach', 'result');
          addLog('   Day 2: Fort Aguada in the morning, day trip to Dudhsagar Falls', 'result');
          addLog('   Day 3: Local market shopping, departure', 'result');
          setPhase('DONE'); }
  ];
  let sIdx = 0;
  function runOne(){
    if(sIdx>=script.length) return false;
    script[sIdx](); sIdx++; return true;
  }
  document.getElementById('agenticStep').addEventListener('click', runOne);
  document.getElementById('agenticRun').addEventListener('click', (e)=>{
    e.target.disabled = true;
    function loop(){
      const more = runOne();
      if(more) setTimeout(loop, 1300); else e.target.disabled = false;
    }
    loop();
  });
  document.getElementById('agenticReset').addEventListener('click', ()=>{
    sIdx=0; logBox.innerHTML=''; memGrid.innerHTML=''; setBudget(0,false);
    taskDefs.forEach((_,i)=>setTask(i,'')); setPhase('PLAN');
    document.getElementById('phaseLabel').textContent='Ready — press ▶ to start';
    document.getElementById('agenticRun').disabled=false;
  });
  setBudget(0,false);
})();

/* ============================= TAB 5: COMPARE ============================= */
(function buildCompare(){
  const el = document.getElementById('panel-compare');
  el.innerHTML = `
    <div class="card">
      <h2>⑤ Side-by-side comparison</h2>
      <div style="overflow-x:auto;">
      <table class="cmp">
        <tr><th>Dimension</th><th style="color:var(--cyan)">Generative AI</th><th style="color:var(--amber)">AI Agent</th><th style="color:var(--green)">Agentic AI</th></tr>
        <tr><td class="rowhead">Core job</td><td>Generate content from a prompt</td><td>Complete one task using reasoning + tools</td><td>Pursue a goal through many sub-tasks</td></tr>
        <tr><td class="rowhead">Memory</td><td>None (each call is fresh)</td><td>Short-term, within one task</td><td>Working memory across the whole goal</td></tr>
        <tr><td class="rowhead">Tool use</td><td>No</td><td>Yes — calls tools/APIs as needed</td><td>Yes — orchestrates multiple tools</td></tr>
        <tr><td class="rowhead">Planning</td><td>None</td><td>Minimal (react to the current request)</td><td>Breaks goal into an ordered task list</td></tr>
        <tr><td class="rowhead">Self-correction</td><td>No</td><td>Rarely</td><td>Yes — reflects and re-plans on failure</td></tr>
        <tr><td class="rowhead">Human involvement</td><td>Every request</td><td>Per task</td><td>Mainly at the goal-setting / approval stage</td></tr>
        <tr><td class="rowhead">Example here</td><td>"Suggest 3 places in Goa"</td><td>"Weather in Goa this weekend?"</td><td>"Plan a 3-day Goa trip under ₹15,000"</td></tr>
        <tr><td class="rowhead">Main risk</td><td>Confidently wrong answers (hallucination)</td><td>Wrong tool call / bad data in → bad answer out</td><td>Compounding errors across steps, runaway cost/actions without guardrails</td></tr>
      </table>
      </div>
    </div>
    <div class="card">
      <h3>Remember</h3>
      <p>An "AI Agent" and "Agentic AI" both sit <i>on top of</i> a generative model — the LLM is still doing
      the actual reasoning and writing at every step. What changes is the <b style="color:var(--text)">scaffolding
      around it</b>: tools, memory, planning, and how much autonomy it's given before checking back in with a human.</p>
    </div>
  `;
})();

/* ============================= TAB 6: GLOSSARY & QUIZ ============================= */
(function buildGlossary(){
  const el = document.getElementById('panel-glossary');
  const terms = [
    ['LLM (Large Language Model)','The neural network trained on huge amounts of text that powers generative AI\'s ability to predict and produce language.'],
    ['Prompt','The input text/instructions given to a model to get a response.'],
    ['Token','A chunk of text (roughly a word or part of a word) — the unit the model actually predicts one at a time.'],
    ['Tool / function calling','A defined action (e.g. "check weather", "search flights") the model can invoke to get real-world data or take a real-world action.'],
    ['Context window','The amount of recent text (prompt + conversation so far) the model can "see" at once.'],
    ['Memory','Information carried forward between steps or sessions — short-term (this task) or long-term (across sessions).'],
    ['Planning','Breaking a large goal into an ordered set of smaller sub-tasks before acting.'],
    ['ReAct pattern','A reason → act → observe loop: the model thinks, takes an action (like a tool call), reads the result, and thinks again.'],
    ['Autonomy','How much a system can do on its own before it needs a human to approve or guide the next step.'],
    ['Reflection / self-correction','The system checking its own output or progress against the goal, and revising its plan if something is off — as seen in the budget-overrun example.'],
    ['Guardrails','Limits put around an autonomous system — budgets, approval checkpoints, allowed tools — to keep its actions safe and bounded.']
  ];
  let glossHtml = '<div class="card"><h2>Glossary</h2><div class="glossary-grid">';
  terms.forEach(t=>{ glossHtml += `<div class="gterm"><b>${t[0]}</b><p>${t[1]}</p></div>`; });
  glossHtml += '</div></div>';

  el.innerHTML = glossHtml + `
    <div class="card">
      <h2>Quick quiz</h2>
      <div id="quizWrap"></div>
      <div id="scoreLine"></div>
    </div>
  `;

  const questions = [
    {q:'Which one has NO memory between separate requests by default?',
     opts:['Generative AI','AI Agent','Agentic AI'], correct:0,
     exp:'Plain generative AI answers a prompt and forgets it — any memory has to be added by the app around it.'},
    {q:'What does an AI Agent add on top of a generative model?',
     opts:['Nothing, they are identical','Tool use and a reasoning→action loop','A physical robot body'], correct:1,
     exp:'An AI Agent pairs the generative core with the ability to call tools/APIs and act on results, usually for one task.'},
    {q:'In the trip-planning example, what triggered the "replan" step?',
     opts:['The weather turned bad','The total cost exceeded the ₹15,000 budget','The flight got cancelled'], correct:1,
     exp:'The agent reflected, saw the running total was ₹16,500 against a ₹15,000 budget, and swapped the hotel to fix it.'},
    {q:'Which layer is best described as "pursues a goal via many sub-tasks with self-correction"?',
     opts:['Generative AI','AI Agent','Agentic AI'], correct:2,
     exp:'That multi-step planning + reflection + replanning behaviour is the defining trait of Agentic AI.'},
    {q:'Why do more autonomous (agentic) systems need guardrails?',
     opts:['They don\'t — more autonomy is always safer','More autonomy means more room for costly mistakes if unchecked','Guardrails make them faster'], correct:1,
     exp:'The more a system can decide and do on its own, the more important budget limits, approval checkpoints, and monitoring become.'}
  ];
  const wrap = document.getElementById('quizWrap');
  let score = 0, answered = 0;
  questions.forEach((qd,qi)=>{
    const block = document.createElement('div');
    block.className = 'quiz-q';
    block.innerHTML = `<div style="font-size:13px;margin-bottom:8px;"><b>${qi+1}. ${qd.q}</b></div>`;
    qd.opts.forEach((opt,oi)=>{
      const b = document.createElement('button');
      b.className = 'quiz-opt';
      b.textContent = opt;
      b.addEventListener('click', ()=>{
        if(b.dataset.locked) return;
        block.querySelectorAll('.quiz-opt').forEach(x=>x.dataset.locked='1');
        if(oi===qd.correct){ b.classList.add('correct'); score++; }
        else { b.classList.add('wrong'); block.children[qd.correct+1].classList.add('correct'); }
        block.querySelector('.quiz-exp').classList.add('show');
        answered++;
        document.getElementById('scoreLine').textContent = `Score: ${score} / ${answered} answered` + (answered===questions.length ? `  —  Final: ${score}/${questions.length}` : '');
      });
      block.appendChild(b);
    });
    const exp = document.createElement('div');
    exp.className = 'quiz-exp';
    exp.textContent = '💡 ' + qd.exp;
    block.appendChild(exp);
    wrap.appendChild(block);
  });
})();
</script>
