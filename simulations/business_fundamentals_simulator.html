<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Fundamentals Learning Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        navy: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.3);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.5);
        }
        .pulse-glow {
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans h-full flex flex-col transition-colors duration-200">
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="sidebarToggle" class="lg:hidden text-slate-500 hover:text-slate-700 dark:text-slate-400 p-2 rounded-lg">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white font-bold text-xl shadow-md">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-none bg-gradient-to-r from-emerald-600 to-teal-600 dark:from-emerald-400 dark:to-teal-400 bg-clip-text text-transparent">BizAcademy</h1>
                        <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">Business Fundamentals Simulator</span>
                    </div>
                </div>
            </div>

            <!-- Global Controls & Progress -->
            <div class="flex items-center gap-3 sm:gap-6">
                <!-- Learning Level Progress -->
                <div class="hidden md:flex flex-col w-40">
                    <div class="flex justify-between text-xs mb-1 font-semibold">
                        <span class="text-slate-500 dark:text-slate-400">Progress</span>
                        <span id="progressText" class="text-emerald-600 dark:text-emerald-400">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>

                <!-- Beginner Mode Toggle -->
                <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-700/50 p-1.5 rounded-lg border border-slate-200 dark:border-slate-600">
                    <span class="text-xs font-semibold text-slate-600 dark:text-slate-300 pl-1">Simple Mode</span>
                    <button id="beginnerToggle" class="w-11 h-6 bg-emerald-500 rounded-full relative transition-colors focus:outline-none">
                        <div id="toggleDot" class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-5 transition-transform duration-200 shadow"></div>
                    </button>
                </div>

                <!-- Dark Mode Button -->
                <button id="darkModeToggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
                </button>

                <!-- Save/Load Actions -->
                <div class="relative group">
                    <button class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                        <i class="fa-solid fa-sliders"></i>
                    </button>
                    <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 hidden group-hover:block p-2 z-50">
                        <button onclick="saveProgress()" class="w-full text-left px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg flex items-center gap-2">
                            <i class="fa-solid fa-floppy-disk text-emerald-500"></i> Save Progress
                        </button>
                        <button onclick="resetProgress()" class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg flex items-center gap-2">
                            <i class="fa-solid fa-rotate-left"></i> Reset All Data
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="absolute lg:static inset-y-0 left-0 z-20 w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 flex flex-col h-full">
            <div class="p-4 border-b border-slate-100 dark:border-slate-700/50 flex justify-between items-center lg:hidden">
                <span class="font-bold text-slate-700 dark:text-slate-200">Modules</span>
                <button id="closeSidebar" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <nav id="navMenu" class="flex-1 overflow-y-auto p-3 space-y-1 custom-scrollbar">
                <!-- Dynamic Navigation Items Populated by JS -->
            </nav>

            <div class="p-3 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50">
                <div class="bg-gradient-to-r from-emerald-500/10 to-teal-500/10 p-3 rounded-xl border border-emerald-500/20 text-center">
                    <p class="text-xs font-semibold text-emerald-800 dark:text-emerald-300">12-Month Business Game</p>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">Ready to run your company?</p>
                    <button onclick="switchModule('game')" class="mt-2 w-full py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-medium shadow transition">
                        <i class="fa-solid fa-gamepad mr-1"></i> Start Simulation
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 custom-scrollbar bg-slate-50 dark:bg-slate-900" id="mainContent">
            <!-- Dynamic Module Content Rendered Here -->
        </main>
    </div>

    <div id="modalContainer" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modalContent" class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative border border-slate-200 dark:border-slate-700">
            <!-- Modal details inserted dynamically -->
        </div>
    </div>

    <script>
        // State Management
        let appState = {
            beginnerMode: true,
            activeModule: 'basics',
            completedModules: new Set(),
            theme: 'light',
            
            // Interactive Calculator States
            bhelVendor: { price: 50, qty: 100, ingredients: 20, packaging: 5, gas: 5, transport: 5, fixed: 5 },
            marketData: { potential: 5000, avgSpend: 100000, somPercent: 5 },
            pricingData: { cost: 100, labor: 20, overhead: 10, margin: 25, discount: 0, tax: 18 },
            revenueData: { price: 200, dailySales: 50, days: 30 },
            pnlData: { sales: 500000, cogs: 250000, rent: 40000, marketing: 30000, salaries: 80000, interest: 10000, taxRate: 20 },
            breakEvenData: { fixedCost: 200000, price: 500, varCost: 300 },
            cashFlowData: { monthlySales: 1000000, creditDays: 60, monthlyExpenses: 700000, startingCash: 500000 },
            
            // Simulation Game State
            game: {
                month: 1,
                cash: 1000000,
                monthlyFixedCost: 200000,
                pricePerUnit: 200000,
                variableCostPerUnit: 120000,
                inventory: 5,
                salesThisMonth: 5,
                marketingBudget: 50000,
                reputation: 80,
                history: [],
                gameOver: false
            }
        };

        const MODULES = [
            { id: 'basics', title: '1. Business Basics', icon: 'fa-graduation-cap', level: 1 },
            { id: 'types', title: '2. Business Types', icon: 'fa-boxes-stacked', level: 2 },
            { id: 'model', title: '3. Business Model Canvas', icon: 'fa-cubes', level: 3 },
            { id: 'market', title: '4. Customer & Market (TAM/SAM/SOM)', icon: 'fa-users', level: 4 },
            { id: 'pricing', title: '5. Product & Pricing Simulator', icon: 'fa-tags', level: 5 },
            { id: 'sales', title: '6. Sales & Revenue', icon: 'fa-sack-dollar', level: 6 },
            { id: 'costs', title: '7. Fixed vs Variable Costs', icon: 'fa-receipt', level: 7 },
            { id: 'pnl', title: '8. Profit & Loss (P&L)', icon: 'fa-file-invoice-dollar', level: 8 },
            { id: 'breakeven', title: '9. Break-Even Analysis', icon: 'fa-scale-balanced', level: 9 },
            { id: 'cashflow', title: '10. Cash Flow vs Profit', icon: 'fa-money-bill-transfer', level: 10 },
            { id: 'working_capital', title: '11. Working Capital Cycle', icon: 'fa-rotate', level: 11 },
            { id: 'roi', title: '12. Investment & ROI', icon: 'fa-piggy-bank', level: 12 },
            { id: 'marketing', title: '13. Marketing & CAC/LTV', icon: 'fa-bullhorn', level: 13 },
            { id: 'operations', title: '14. Operations & Bottlenecks', icon: 'fa-gears', level: 14 },
            { id: 'employees', title: '15. Employee Cost Simulator', icon: 'fa-user-tie', level: 15 },
            { id: 'competition', title: '16. Competitor Matrix', icon: 'fa-chess', level: 16 },
            { id: 'metrics', title: '17. Metrics Dashboard', icon: 'fa-chart-pie', level: 17 },
            { id: 'case_studies', title: '18. Real Case Studies', icon: 'fa-book-open', level: 18 },
            { id: 'custom_biz', title: '19. Start Your Own Business', icon: 'fa-rocket', level: 19 },
            { id: 'game', title: '20. 12-Month CEO Game', icon: 'fa-gamepad', level: 20 },
            { id: 'quiz', title: '21. Knowledge Quiz', icon: 'fa-circle-question', level: 21 },
            { id: 'formulas', title: '22. Formula Library', icon: 'fa-calculator', level: 22 },
            { id: 'why_fail', title: '23. Why Businesses Fail', icon: 'fa-triangle-exclamation', level: 23 },
            { id: 'challenge', title: '24. Final Business Challenge', icon: 'fa-trophy', level: 24 }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            loadProgress();
            switchModule(appState.activeModule);

            // Toggle Listeners
            document.getElementById('beginnerToggle').addEventListener('click', toggleBeginnerMode);
            document.getElementById('darkModeToggle').addEventListener('click', toggleDarkMode);
            document.getElementById('sidebarToggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('-translate-x-full');
            });
            document.getElementById('closeSidebar').addEventListener('click', () => {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            });
        });

        function renderSidebar() {
            const nav = document.getElementById('navMenu');
            nav.innerHTML = MODULES.map(m => `
                <button onclick="switchModule('${m.id}')" id="nav-${m.id}" 
                    class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-between transition-all duration-150 ${appState.activeModule === m.id ? 'bg-emerald-500 text-white shadow-md' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50'}">
                    <div class="flex items-center gap-2.5 truncate">
                        <i class="fa-solid ${m.icon} w-4 text-center"></i>
                        <span class="truncate">${m.title}</span>
                    </div>
                    ${appState.completedModules.has(m.id) ? '<i class="fa-solid fa-circle-check text-emerald-200"></i>' : ''}
                </button>
            `).join('');
            updateProgressBar();
        }

        function switchModule(id) {
            appState.activeModule = id;
            appState.completedModules.add(id);
            renderSidebar();
            
            // Close sidebar on mobile
            document.getElementById('sidebar').classList.add('-translate-x-full');

            const main = document.getElementById('mainContent');
            main.scrollTop = 0;

            switch(id) {
                case 'basics': renderBasicsModule(main); break;
                case 'types': renderTypesModule(main); break;
                case 'model': renderModelModule(main); break;
                case 'market': renderMarketModule(main); break;
                case 'pricing': renderPricingModule(main); break;
                case 'sales': renderSalesModule(main); break;
                case 'costs': renderCostsModule(main); break;
                case 'pnl': renderPnLModule(main); break;
                case 'breakeven': renderBreakEvenModule(main); break;
                case 'cashflow': renderCashFlowModule(main); break;
                case 'working_capital': renderWorkingCapitalModule(main); break;
                case 'roi': renderRoiModule(main); break;
                case 'marketing': renderMarketingModule(main); break;
                case 'operations': renderOperationsModule(main); break;
                case 'employees': renderEmployeesModule(main); break;
                case 'competition': renderCompetitionModule(main); break;
                case 'metrics': renderMetricsModule(main); break;
                case 'case_studies': renderCaseStudiesModule(main); break;
                case 'custom_biz': renderCustomBizModule(main); break;
                case 'game': renderGameModule(main); break;
                case 'quiz': renderQuizModule(main); break;
                case 'formulas': renderFormulasModule(main); break;
                case 'why_fail': renderWhyFailModule(main); break;
                case 'challenge': renderChallengeModule(main); break;
                default: main.innerHTML = `<p class="p-4">Module under construction.</p>`;
            }
        }

        function toggleBeginnerMode() {
            appState.beginnerMode = !appState.beginnerMode;
            const dot = document.getElementById('toggleDot');
            const toggle = document.getElementById('beginnerToggle');
            if (appState.beginnerMode) {
                dot.style.transform = 'translateX(0px)';
                toggle.classList.replace('bg-slate-400', 'bg-emerald-500');
            } else {
                dot.style.transform = 'translateX(-20px)';
                toggle.classList.replace('bg-emerald-500', 'bg-slate-400');
            }
            switchModule(appState.activeModule);
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function updateProgressBar() {
            const percent = Math.round((appState.completedModules.size / MODULES.length) * 100);
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').innerText = `${percent}%`;
        }

        function renderBasicsModule(container) {
            container.innerHTML = `
                <div class="max-w-5xl mx-auto space-y-8">
                    <!-- Title Banner -->
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white rounded-2xl p-6 sm:p-8 shadow-lg">
                        <span class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Module 1</span>
                        <h2 class="text-2xl sm:text-3xl font-bold mt-2">What is a Business?</h2>
                        <p class="text-emerald-100 mt-2 max-w-2xl text-sm sm:text-base leading-relaxed">
                            ${appState.beginnerMode ? 
                                "A business is simply a system that solves a problem for someone in exchange for money. Let's see how money actually flows through a business!" :
                                "A business is an enterprise organized to produce and trade value to satisfy customer needs, generating sustainable economic profit."}
                        </p>
                    </div>

                    <!-- Flow Visualizer -->
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-diagram-project text-emerald-500"></i> The Lifecycle of Business Value
                        </h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 text-center">
                            ${[
                                { step: '1. Idea', desc: 'Identify a problem', icon: 'fa-lightbulb', color: 'bg-amber-500' },
                                { step: '2. Product', desc: 'Build the solution', icon: 'fa-box', color: 'bg-blue-500' },
                                { step: '3. Customer', desc: 'Find who pays', icon: 'fa-user-check', color: 'bg-indigo-500' },
                                { step: '4. Revenue', desc: 'Collect payment', icon: 'fa-money-bill-wave', color: 'bg-emerald-500' },
                                { step: '5. Expense', desc: 'Pay production costs', icon: 'fa-receipt', color: 'bg-rose-500' },
                                { step: '6. Profit', desc: 'What remains', icon: 'fa-piggy-bank', color: 'bg-purple-500' }
                            ].map(item => `
                                <div onclick="explainStep('${item.step}')" class="p-4 rounded-xl bg-slate-50 dark:bg-slate-700/50 hover:bg-emerald-50 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-600 cursor-pointer transition text-left group">
                                    <div class="w-8 h-8 ${item.color} text-white rounded-lg flex items-center justify-center mb-2 shadow-sm group-hover:scale-110 transition">
                                        <i class="fa-solid ${item.icon}"></i>
                                    </div>
                                    <div class="font-bold text-xs text-slate-800 dark:text-slate-100">${item.step}</div>
                                    <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">${item.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Interactive Bhel Vendor Example -->
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                            <div>
                                <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                    <i class="fa-solid fa-bowl-food text-amber-500"></i> Real Example: Street Food Bhel Vendor
                                </h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                                    Selling price is ₹50. Why is ₹50 NOT pure profit? Adjust daily plates sold below:
                                </p>
                            </div>
                            <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-lg">
                                <span class="text-xs font-semibold">Daily Plates:</span>
                                <input type="number" id="bhelQty" value="${appState.bhelVendor.qty}" onchange="updateBhelCalc()" class="w-16 px-2 py-0.5 rounded border dark:bg-slate-800 text-center text-sm font-bold">
                            </div>
                        </div>

                        <!-- Calculation Breakdown Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                            <div class="space-y-3">
                                <div class="flex justify-between items-center p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800">
                                    <span class="font-bold text-sm text-emerald-800 dark:text-emerald-300">Selling Price per Plate</span>
                                    <span class="font-bold text-lg text-emerald-600 dark:text-emerald-400">₹50.00</span>
                                </div>
                                <div class="space-y-1.5 text-xs">
                                    <div class="flex justify-between p-2 rounded bg-slate-50 dark:bg-slate-700/50"><span>- Ingredients (Puffed rice, spices, veggies):</span> <span class="font-semibold text-red-500">₹20.00</span></div>
                                    <div class="flex justify-between p-2 rounded bg-slate-50 dark:bg-slate-700/50"><span>- Disposable Packaging & Spoon:</span> <span class="font-semibold text-red-500">₹5.00</span></div>
                                    <div class="flex justify-between p-2 rounded bg-slate-50 dark:bg-slate-700/50"><span>- Gas/Electricity:</span> <span class="font-semibold text-red-500">₹5.00</span></div>
                                    <div class="flex justify-between p-2 rounded bg-slate-50 dark:bg-slate-700/50"><span>- Cart Transport & Permit:</span> <span class="font-semibold text-red-500">₹5.00</span></div>
                                    <div class="flex justify-between p-2 rounded bg-slate-50 dark:bg-slate-700/50"><span>- Fixed Stall Rent Allocation:</span> <span class="font-semibold text-red-500">₹5.00</span></div>
                                </div>
                                <div id="bhelProfitBox" class="flex justify-between items-center p-3 rounded-xl bg-purple-50 dark:bg-purple-950/30 border border-purple-200 dark:border-purple-800">
                                    <span class="font-bold text-sm text-purple-800 dark:text-purple-300">= True Profit per Plate</span>
                                    <span class="font-bold text-xl text-purple-600 dark:text-purple-400">₹10.00</span>
                                </div>
                            </div>

                            <!-- Visual Stacked Bar -->
                            <div class="bg-slate-50 dark:bg-slate-700/30 p-4 rounded-xl border border-slate-200 dark:border-slate-700 flex flex-col justify-between h-full">
                                <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-2">Daily Financial Summary</h4>
                                <div class="space-y-4">
                                    <div>
                                        <div class="flex justify-between text-xs mb-1 font-semibold">
                                            <span>Total Revenue Collected:</span>
                                            <span id="bhelTotalRev" class="text-emerald-600 font-bold">₹5,000</span>
                                        </div>
                                        <div class="w-full bg-slate-200 dark:bg-slate-600 h-3 rounded-full overflow-hidden flex">
                                            <div id="barExp" style="width: 80%" class="bg-rose-500 h-full"></div>
                                            <div id="barProf" style="width: 20%" class="bg-emerald-500 h-full"></div>
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2 text-center">
                                        <div class="p-2 bg-rose-50 dark:bg-rose-900/20 rounded-lg">
                                            <div class="text-[10px] text-rose-600 font-bold">Total Expenses</div>
                                            <div id="bhelTotalExp" class="text-sm font-bold text-rose-700 dark:text-rose-400">₹4,000</div>
                                        </div>
                                        <div class="p-2 bg-emerald-50 dark:bg-emerald-900/20 rounded-lg">
                                            <div class="text-[10px] text-emerald-600 font-bold">Net Profit</div>
                                            <div id="bhelTotalProf" class="text-sm font-bold text-emerald-700 dark:text-emerald-400">₹1,000</div>
                                        </div>
                                    </div>
                                </div>
                                <p class="text-[11px] text-slate-400 mt-4 italic">
                                    Key Lesson: Revenue (Total Cash Collected) ≠ Profit! You must subtract all costs to know your real income.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            updateBhelCalc();
        }

        function updateBhelCalc() {
            const qty = parseInt(document.getElementById('bhelQty').value) || 0;
            appState.bhelVendor.qty = qty;
            const rev = qty * 50;
            const exp = qty * 40;
            const prof = rev - exp;

            document.getElementById('bhelTotalRev').innerText = `₹${rev.toLocaleString()}`;
            document.getElementById('bhelTotalExp').innerText = `₹${exp.toLocaleString()}`;
            document.getElementById('bhelTotalProf').innerText = `₹${prof.toLocaleString()}`;

            const sellingPrice = marginPct < 100 ? totalCost / (1 - (marginPct / 100)) : totalCost;

            const markupPct = totalCost > 0 ? (grossProfit / totalCost) * 100 : 0;

            document.getElementById('pTotalCost').innerText = `₹${totalCost.toFixed(2)}`;
            document.getElementById('pSellingPrice').innerText = `₹${sellingPrice.toFixed(2)}`;

        function calcCustomBiz() {
            const price = parseFloat(document.getElementById('cbPrice').value) || 0;
            const varCost = parseFloat(document.getElementById('cbVar').value) || 0;
            const fixed = parseFloat(document.getElementById('cbFixed').value) || 0;

            const contrib = price - varCost;
            const beUnits = contrib > 0 ? Math.ceil(fixed / contrib) : 'N/A';

            const rep = document.getElementById('cbReport');
            rep.classList.remove('hidden');
            rep.innerHTML = `
                <div class="font-bold text-emerald-800 dark:text-emerald-300">Feasibility Analysis:</div>
                <div>Contribution Margin: <strong>₹${contrib.toLocaleString()}</strong> per unit</div>
                <div>Monthly Break-Even Sales Needed: <strong>${beUnits} units/month</strong></div>
            `;
        }

        function renderGameModule(container) {

                        </div>
                    ` : `

                                    <input type="number" id="gPrice" value="${g.pricePerUnit}" class="w-full p-2 mt-1 bg-slate-50 dark:bg-slate-700 rounded border">
                                </div>
                                <div>
                                    <label class="font-semibold">Marketing Budget (₹):</label>
                                    <input type="number" id="gMkt" value="${g.marketingBudget}" class="w-full p-2 mt-1 bg-slate-50 dark:bg-slate-700 rounded border">
                                </div>
                                <div>
                                    <label class="font-semibold">Inventory Units Produced:</label>
                                    <input type="number" id="gInv" value="${g.inventory}" class="w-full p-2 mt-1 bg-slate-50 dark:bg-slate-700 rounded border">
                                </div>
                            </div>
                            <button onclick="advanceGameTurn()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm shadow transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-play"></i> Advance Month ${g.month}
                            </button>
                        </div>
                    `}
                </div>
            `;
        }

        function advanceGameTurn() {
            const g = appState.game;
            const price = parseFloat(document.getElementById('gPrice').value) || 200000;
            const mkt = parseFloat(document.getElementById('gMkt').value) || 50000;
            const invToMake = parseInt(document.getElementById('gInv').value) || 5;

            // Simple demand formula
            const demand = Math.max(1, Math.floor((mkt / 10000) * (200000 / price) * 3));
            const actualSales = Math.min(demand, invToMake);

            const rev = actualSales * price;
            const prodCost = invToMake * g.variableCostPerUnit;
            const totalExp = prodCost + g.monthlyFixedCost + mkt;
            const netCashChange = rev - totalExp;

            g.cash += netCashChange;
            g.month++;

            if (g.month > 12 || g.cash <= 0) {
                g.gameOver = true;
            }

            renderGameModule(document.getElementById('mainContent'));
        }

        function resetGame() {
            appState.game = {
                month: 1,
                cash: 1000000,
                monthlyFixedCost: 200000,
                pricePerUnit: 200000,
                variableCostPerUnit: 120000,
                inventory: 5,
                salesThisMonth: 5,
                marketingBudget: 50000,
                reputation: 80,
                history: [],
                gameOver: false
            };
            renderGameModule(document.getElementById('mainContent'));
        }

        function showModal(title, bodyHtml) {
            const container = document.getElementById('modalContainer');

            `;
            container.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalContainer').classList.add('hidden');
        }

        function saveProgress() {
            localStorage.setItem('biz_sim_state', JSON.stringify({
                completedModules: Array.from(appState.completedModules),
                beginnerMode: appState.beginnerMode
            }));
            alert('Progress saved to browser localStorage!');
        }

        function loadProgress() {
            const saved = localStorage.getItem('biz_sim_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appState.completedModules = new Set(parsed.completedModules);
                    appState.beginnerMode = parsed.beginnerMode;
                } catch(e) {}
            }
        }

        function resetProgress() {
            if (confirm('Are you sure you want to reset all progress data?')) {
                localStorage.removeItem('biz_sim_state');
                appState.completedModules = new Set();
                switchModule('basics');
            }
        }
